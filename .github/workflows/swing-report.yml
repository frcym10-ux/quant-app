# スイング候補レポートの定期実行（GitHub Actions・PCの起動不要）
# 平日 朝（寄り前）と 夕方（引け後）にスキャンしてVercelへ公開する。
# 注: GitHub Actionsのスケジュールは混雑時に30〜90分ほど遅延する（ベストエフォート）。
#     朝枠が寄り付き9:00を過ぎないよう、定刻を 6:00 JST に前倒ししてバッファを確保している。
name: swing-report

on:
  schedule:
    # JST = UTC+9。月〜金 6:00 JST（寄り前・遅延バッファ込み）= 日〜木 21:00 UTC
    - cron: "0 21 * * 0-4"
    # 月〜金 16:30 JST（引け後）= 月〜金 7:30 UTC
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}  # 手動実行も可能

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_vVRxxz1tdCVHPR8ZnUpYUR7O
      VERCEL_PROJECT_ID: prj_W8JC3zES4kCbWyfNRAr1WpFNd3ni
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements-ci.txt

      - name: スキャン実行・レポート生成・メール通知
        run: python tools/publish_report.py
        env:
          # 保有銘柄の読み取り: Supabase（アプリで取込した保有が自動反映）。
          # 未設定なら HOLDINGS_JSON にフォールバックする。
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          # アクションがある日の自分宛メール通知用（未設定なら通知はスキップ）
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          REPORT_URL: https://swing-report.vercel.app

      - name: Vercelへデプロイ
        run: npx vercel@latest deploy --prod --yes --cwd swing-report --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
