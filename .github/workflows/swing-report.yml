# スイング候補レポートの定期実行（GitHub Actions・PCの起動不要）
# 平日 朝（寄り前）と 夕方（引け後）にスキャンしてVercelへ公開する。
# 注: GitHub Actionsのスケジュールは混雑時に30〜90分ほど遅延する（ベストエフォート）。
#     朝枠が寄り付き9:00を過ぎないよう、定刻を 6:00 JST に前倒ししてバッファを確保している。
name: swing-report

on:
  schedule:
    # JST = UTC+9。月〜金 6:00 JST（寄り前・遅延バッファ込み）= 日〜木 21:00 UTC
    - cron: "0 21 * * 0-4"
    # 月〜金 16:30 JST（引け後）= 月〜金 7:30 UTC
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}  # 手動実行も可能

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_vVRxxz1tdCVHPR8ZnUpYUR7O
      VERCEL_PROJECT_ID: prj_W8JC3zES4kCbWyfNRAr1WpFNd3ni
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements-ci.txt

      - name: スキャン実行・レポート生成・メール通知
        # --weekly を付けて「📋 今週の候補」タブ（週次スクリーナー6プリセット）も毎回生成する。
        # これで平日更新でもタブが消えず、常にVercelに反映される（財務取得で数分伸びるが許容）。
        run: python tools/publish_report.py --weekly
        env:
          # 保有銘柄の読み取り: Supabase（アプリで取込した保有が自動反映）。
          # 未設定なら HOLDINGS_JSON にフォールバックする。
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          # 決算予定日の手動登録（任意）: {"6702":"2026-07-30", ...} を入れると
          # 「今週の候補」カードで ±14営業日以内なら「⚠️決算接近」と警告する。
          # 未登録銘柄はJQUANTS_API_KEY設定時のみJ-Quantsから自動補完する。
          EARNINGS_JSON: ${{ secrets.EARNINGS_JSON }}
          # J-Quants APIキー（任意）: 設定すると財務指標（ROE・PER・配当利回り・
          # 経常利益変化率）と決算発表予定日の精度・網羅性が上がる。未設定ならyfinance/手動登録のみ。
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          # アクションがある日の自分宛メール通知用（未設定なら通知はスキップ）
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          REPORT_URL: https://swing-report.vercel.app

      - name: Vercelへデプロイ
        run: npx vercel@latest deploy --prod --yes --cwd swing-report --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
