# ヒストリカル検証（バックテスト）を手動実行するワークフロー
# スマホからでも「Run workflow」→実行後にジョブのSummaryタブで結果が読める
# （Pythonのローカル実行環境が無くても使える）。
name: backtest

on:
  workflow_dispatch:
    inputs:
      target:
        description: "検証対象"
        required: false
        default: "swing"
        type: choice
        options:
          - swing        # 戦略α/β（swing_scannerの日々のシグナル）
          - screener      # 週次スクリーナー6プリセット（今週の候補ロジック）
      strategy:
        description: >-
          target=swing のとき: alpha / beta（空欄なら両方）。
          target=screener のとき: プリセットID ①〜⑥（空欄なら全6つ）
        required: false
        default: ""
      period:
        description: "検証期間（例: 1y, 2y, 3y, 5y）"
        required: false
        default: "2y"

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements-ci.txt

      - name: バックテスト実行（結果はこのジョブのSummaryに出力）
        run: |
          ARGS=()
          if [ -n "${{ inputs.strategy }}" ]; then ARGS+=("${{ inputs.strategy }}"); fi
          if [ -n "${{ inputs.period }}" ]; then ARGS+=("${{ inputs.period }}"); fi
          if [ "${{ inputs.target }}" = "screener" ]; then
            SCRIPT=tools/backtest_screener.py
          else
            SCRIPT=tools/backtest.py
          fi
          {
            echo "## 📊 バックテスト結果（${{ inputs.target }}）"
            echo '```'
            python "$SCRIPT" "${ARGS[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
